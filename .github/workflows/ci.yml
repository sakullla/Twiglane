name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks, tests and build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Check
        run: npm run check
      - name: Test
        run: npm test
      - name: Integration checks
        run: npm run test:integration
      - name: Test release gate
        run: node --test .github/scripts/release-gate.test.cjs
      - name: Build
        run: npm run build

  rust:
    name: Rust tests and clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        timeout-minutes: 10
        run: bash .github/scripts/install-linux-deps.sh
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Setup Python for process tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          cache-bin: false
      - name: Test
        timeout-minutes: 15
        run: /usr/bin/time -v timeout --signal=TERM --kill-after=15s 12m cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=4
      - name: Clippy
        timeout-minutes: 10
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  rust-macos:
    name: Rust macOS check and clippy
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          cache-bin: false
      - name: Check macOS target
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
      - name: Clippy macOS target
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --all-targets -- -D warnings

  rust-windows:
    name: Rust Windows tests and clippy
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Setup Python for process tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          cache-bin: false
      - name: Test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

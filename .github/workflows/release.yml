name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Wait for the tagged commit to pass main CI
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve tag to commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate version and wait for main CI
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const { validateVersion, waitForMainCi } = require('./.github/scripts/release-gate.cjs');
            validateVersion(process.env.RELEASE_TAG);
            await waitForMainCi({ github, repo: context.repo, sha: process.env.RELEASE_SHA, log: core.info });

  prepare:
    name: Prepare draft release
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - name: Create or resume draft for the verified commit
        id: draft
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.RELEASE_SHA;
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const existing = releases.find(release => release.tag_name === tag);
            if (existing && (!existing.draft || existing.target_commitish !== sha)) {
              throw new Error('Release already published or belongs to a different commit; use a new version tag.');
            }
            const { data: notes } = await github.rest.repos.generateReleaseNotes({
              ...context.repo, tag_name: tag, target_commitish: sha,
            });
            const params = { ...context.repo, tag_name: tag, target_commitish: sha,
              name: `Twiglane ${tag}`, draft: true, prerelease: false,
              body: `${notes.body}\n\nWindows x64: NSIS 安装包；macOS Apple Silicon: DMG；Linux x64: deb/AppImage。\n\n各安装包内置 Linux 和 macOS 的 x86_64、ARM64，以及 Windows x64 的已签名远端 Git 组件。\n\n测试分发：Windows 未签名；macOS 使用固定自签证书，未经过 Apple 公证。需要系统 Git；Windows 缺少 WebView2 时安装器会联网下载。` };
            const { data: release } = existing
              ? await github.rest.repos.updateRelease({ ...params, release_id: existing.id })
              : await github.rest.repos.createRelease(params);
            core.setOutput('release-id', release.id);

  remote-agent-v2-build:
    name: Build remote agent (${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            folder: Linux-x86_64
            system: linux
            arch: x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            folder: Linux-aarch64
            system: linux
            arch: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            folder: macOS-x86_64
            system: macos
            arch: x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            folder: macOS-aarch64
            system: macos
            arch: aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            folder: Windows-x86_64
            system: windows
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: remote-agent/v2 -> target
          cache-bin: false
      - name: Run protocol tests on the Linux release baseline
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked --manifest-path remote-agent/v2/Cargo.toml --test protocol
      - name: Build and identify the target agent
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          AGENT_FOLDER: ${{ matrix.folder }}
          AGENT_SYSTEM: ${{ matrix.system }}
          AGENT_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET" --manifest-path remote-agent/v2/Cargo.toml
          binary=twiglane-agent-v2
          if [ "$AGENT_SYSTEM" = windows ]; then binary+=.exe; fi
          folder="agent-v2-staging/$AGENT_FOLDER"
          mkdir -p "$folder"
          cp "remote-agent/v2/target/$TARGET/release/$binary" "$folder/$binary"
          "$folder/$binary" --probe | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const probe = JSON.parse(readFileSync(0, "utf8"));
            const version = /^version = "([^"]+)"/m.exec(readFileSync("remote-agent/v2/Cargo.toml", "utf8"))?.[1];
            if (!version || probe.version !== version || probe.protocol !== 2 ||
                probe.os !== process.env.AGENT_SYSTEM || probe.arch !== process.env.AGENT_ARCH) {
              throw new Error(`Unexpected remote agent identity: ${JSON.stringify(probe)}`);
            }'
      - uses: actions/upload-artifact@v7
        with:
          name: remote-agent-v2-part-${{ matrix.folder }}
          path: agent-v2-staging/
          if-no-files-found: error

  remote-agent-v2:
    name: Sign and assemble all remote agents
    needs: [gate, remote-agent-v2-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v7
        with:
          pattern: remote-agent-v2-part-*
          merge-multiple: true
          path: src-tauri/agent-v2/
      - name: Install Minisign verifier
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign and verify every binary and its digest statement
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          agent_dir=src-tauri/agent-v2
          version=$(sed -nE 's/^version = "([^"]+)"$/\1/p' remote-agent/v2/Cargo.toml)
          pubkey=$(node -p "Buffer.from(require('./src-tauri/tauri.conf.json').plugins.updater.pubkey, 'base64').toString().trim().split('\n').at(-1)")
          for agent in "$agent_dir"/{Linux-x86_64,Linux-aarch64,macOS-x86_64,macOS-aarch64}/twiglane-agent-v2 "$agent_dir"/Windows-x86_64/twiglane-agent-v2.exe; do
            digest=$(sha256sum "$agent" | cut -d' ' -f1)
            statement="$RUNNER_TEMP/twiglane-agent-v2-digest.txt"
            printf 'twiglane-agent-v2 sha256:%s\n' "$digest" > "$statement"
            npm run tauri -- signer sign --app-version "$version" "$agent"
            npm run tauri -- signer sign --app-version "$version" "$statement"
            base64 --decode "$agent.sig" > "$RUNNER_TEMP/twiglane-agent-v2.minisig"
            minisign -Vm "$agent" -P "$pubkey" -x "$RUNNER_TEMP/twiglane-agent-v2.minisig"
            base64 --decode "$statement.sig" > "$RUNNER_TEMP/twiglane-agent-v2.minisig"
            minisign -Vm "$statement" -P "$pubkey" -x "$RUNNER_TEMP/twiglane-agent-v2.minisig"
            mv "$statement.sig" "$agent.digest.sig"
          done
          for agent in "$agent_dir"/{macOS-x86_64,macOS-aarch64}/twiglane-agent-v2; do
            gzip -n -- "$agent"
            mv "$agent.sig" "$agent.gz.sig"
            mv "$agent.digest.sig" "$agent.gz.digest.sig"
          done
          node scripts/remote-worktree/agent-v2-manifest.mjs --write "$agent_dir" --version "$version" --require-all
          node scripts/remote-worktree/agent-v2-manifest.mjs --check "$agent_dir" --version "$version" --require-all
      - uses: actions/upload-artifact@v7
        with:
          name: remote-agent-v2
          path: src-tauri/agent-v2/
          if-no-files-found: error

  release:
    name: Build release (${{ matrix.target }})
    needs: [gate, prepare, remote-agent-v2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash .github/scripts/install-linux-deps.sh
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          cache-bin: false
          cache-on-failure: true
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v7
        with:
          name: remote-agent-v2
          path: src-tauri/agent-v2/
      - name: Check bundled remote agent manifest
        run: node scripts/remote-worktree/agent-v2-manifest.mjs --check src-tauri/agent-v2 --require-all
      - name: Sign the bundled legacy remote agent
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node .github/scripts/sign-remote-agent.mjs
      - name: Require stable macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
      - name: Build and upload installers to draft
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          retryAttempts: 3
          # latest.json 由 verify-release 在三平台产物齐全后统一生成，避免并行任务互相覆盖。
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Build, sign and verify macOS disk image
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/sign-macos.sh
      - name: Verify remote agents in the signed macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          arch="${TARGET%%-*}"
          dmg="src-tauri/target/$TARGET/release/bundle/dmg/Twiglane_${version}_${arch}.dmg"
          mount="$(mktemp -d "$RUNNER_TEMP/twiglane-agent-check.XXXXXX")"
          mounted=false
          cleanup() {
            if "$mounted"; then hdiutil detach "$mount"; fi
            rmdir "$mount"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -mountpoint "$mount" -readonly -nobrowse -noverify -noautoopen
          mounted=true
          node scripts/remote-worktree/agent-v2-manifest.mjs --check \
            "$mount/Twiglane.app/Contents/Resources/agent-v2" --require-all
      - name: Upload verified macOS release artifacts
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          arch="${TARGET%%-*}"
          gh release upload "$RELEASE_TAG" \
            "src-tauri/target/$TARGET/release/bundle/dmg/Twiglane_${version}_${arch}.dmg" \
            "src-tauri/target/$TARGET/release/bundle/macos/Twiglane_${version}_${arch}.app.tar.gz" \
            "src-tauri/target/$TARGET/release/bundle/macos/Twiglane_${version}_${arch}.app.tar.gz.sig" --clobber

  verify-release:
    name: Verify installers and publish release
    needs: [gate, prepare, release]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify draft assets and unchanged tag before publishing
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: `refs/tags/${process.env.RELEASE_TAG}` });
            if (commit.sha !== process.env.RELEASE_SHA) throw new Error('Release tag moved after CI verification.');
            const { data: release } = await github.rest.repos.getRelease({ ...context.repo, release_id });
            if (!release.draft) throw new Error('Release must remain a draft until verification completes.');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id, per_page: 100 });
            const version = process.env.RELEASE_TAG.slice(1);
            for (const name of [
              `Twiglane_${version}_x64-setup.exe`, `Twiglane_${version}_aarch64.dmg`,
              `Twiglane_${version}_amd64.deb`, `Twiglane_${version}_amd64.AppImage`,
            ]) {
              if (!assets.some(asset => asset.name === name && asset.state === 'uploaded' && asset.size > 0)) {
                throw new Error(`Missing installer: ${name}`);
              }
            }
            // 应用内更新依赖各平台更新包及签名；缺失时发布出去会导致客户端检查更新失败。
            for (const name of [
              `Twiglane_${version}_x64-setup.exe.sig`, `Twiglane_${version}_amd64.AppImage.sig`,
              `Twiglane_${version}_amd64.deb.sig`, `Twiglane_${version}_aarch64.app.tar.gz`,
              `Twiglane_${version}_aarch64.app.tar.gz.sig`,
            ]) {
              if (!assets.some(asset => asset.name === name && asset.state === 'uploaded' && asset.size > 0)) {
                throw new Error(`Missing updater artifact: ${name}; check TAURI_SIGNING_PRIVATE_KEY secrets`);
              }
            }
      - name: Generate and upload updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 本 job 不 checkout 仓库，gh 必须显式指定 -R。
          repo=(-R "$GITHUB_REPOSITORY")
          version="${GITHUB_REF_NAME#v}"
          work="$RUNNER_TEMP/updater-manifest"
          mkdir -p "$work"
          gh release download "$GITHUB_REF_NAME" "${repo[@]}" --pattern "*.sig" --dir "$work" --clobber

          win_sig="$work/Twiglane_${version}_x64-setup.exe.sig"
          linux_sig="$work/Twiglane_${version}_amd64.AppImage.sig"
          deb_sig="$work/Twiglane_${version}_amd64.deb.sig"
          mac_sig="$work/Twiglane_${version}_aarch64.app.tar.gz.sig"
          for file in "$win_sig" "$linux_sig" "$deb_sig" "$mac_sig"; do
            test -f "$file"
          done

          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          notes="$(gh release view "$GITHUB_REF_NAME" "${repo[@]}" --json body --jq '.body')"
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_sig "$(cat "$win_sig")" \
            --arg win_url "$base/Twiglane_${version}_x64-setup.exe" \
            --arg linux_sig "$(cat "$linux_sig")" \
            --arg linux_url "$base/Twiglane_${version}_amd64.AppImage" \
            --arg deb_sig "$(cat "$deb_sig")" \
            --arg deb_url "$base/Twiglane_${version}_amd64.deb" \
            --arg mac_sig "$(cat "$mac_sig")" \
            --arg mac_url "$base/Twiglane_${version}_aarch64.app.tar.gz" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: $win_url },
                "windows-x86_64-nsis": { signature: $win_sig, url: $win_url },
                "linux-x86_64": { signature: $linux_sig, url: $linux_url },
                "linux-x86_64-appimage": { signature: $linux_sig, url: $linux_url },
                "linux-x86_64-deb": { signature: $deb_sig, url: $deb_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "darwin-aarch64-app": { signature: $mac_sig, url: $mac_url }
              }
            }' > "$work/latest.json"
          gh release upload "$GITHUB_REF_NAME" "${repo[@]}" "$work/latest.json" --clobber
      - name: Publish verified release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const { data: release } = await github.rest.repos.updateRelease({ ...context.repo, release_id, draft: false });
            core.info(`Published ${release.html_url}`);

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Wait for the tagged commit to pass main CI
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve tag to commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate version and wait for main CI
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const { validateVersion, waitForMainCi } = require('./.github/scripts/release-gate.cjs');
            validateVersion(process.env.RELEASE_TAG);
            await waitForMainCi({ github, repo: context.repo, sha: process.env.RELEASE_SHA, log: core.info });

  prepare:
    name: Prepare draft release
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - name: Create or resume draft for the verified commit
        id: draft
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.RELEASE_SHA;
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const existing = releases.find(release => release.tag_name === tag);
            if (existing && (!existing.draft || existing.target_commitish !== sha)) {
              throw new Error('Release already published or belongs to a different commit; use a new version tag.');
            }
            const { data: notes } = await github.rest.repos.generateReleaseNotes({
              ...context.repo, tag_name: tag, target_commitish: sha,
            });
            const params = { ...context.repo, tag_name: tag, target_commitish: sha,
              name: `Twiglane ${tag}`, draft: true, prerelease: false,
              body: `${notes.body}\n\nWindows x64: NSIS 安装包；macOS Apple Silicon: DMG；Linux x64: deb/AppImage。\n\n测试分发：Windows 未签名；macOS 使用固定自签证书，未经过 Apple 公证。需要系统 Git；Windows 缺少 WebView2 时安装器会联网下载。` };
            const { data: release } = existing
              ? await github.rest.repos.updateRelease({ ...params, release_id: existing.id })
              : await github.rest.repos.createRelease(params);
            core.setOutput('release-id', release.id);

  release:
    name: Build release (${{ matrix.target }})
    needs: [gate, prepare]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash .github/scripts/install-linux-deps.sh
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          cache-bin: false
          cache-on-failure: true
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Require stable macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
      - name: Build and upload installers to draft
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          retryAttempts: 3
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Build, sign and verify macOS disk image
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/sign-macos.sh
      - name: Upload verified macOS disk image
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          arch="${TARGET%%-*}"
          gh release upload "$RELEASE_TAG" \
            "src-tauri/target/$TARGET/release/bundle/dmg/Twiglane_${version}_${arch}.dmg" --clobber

  verify-release:
    name: Verify installers and publish release
    needs: [gate, prepare, release]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify draft assets and unchanged tag before publishing
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: `refs/tags/${process.env.RELEASE_TAG}` });
            if (commit.sha !== process.env.RELEASE_SHA) throw new Error('Release tag moved after CI verification.');
            const { data: release } = await github.rest.repos.getRelease({ ...context.repo, release_id });
            if (!release.draft) throw new Error('Release must remain a draft until verification completes.');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id, per_page: 100 });
            const version = process.env.RELEASE_TAG.slice(1);
            for (const name of [
              `Twiglane_${version}_x64-setup.exe`, `Twiglane_${version}_aarch64.dmg`,
              `Twiglane_${version}_amd64.deb`, `Twiglane_${version}_amd64.AppImage`,
            ]) {
              if (!assets.some(asset => asset.name === name && asset.state === 'uploaded' && asset.size > 0)) {
                throw new Error(`Missing installer: ${name}`);
              }
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id, draft: false });
            core.info(`Published ${release.html_url}`);

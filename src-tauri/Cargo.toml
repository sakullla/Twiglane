[package]
name = "twiglane"
version = "0.3.13"
description = "Twiglane desktop Git workspace"
edition = "2021"
publish = false
license = "UNLICENSED"

[lints.rust]
# rustc excludes linker_messages from the warnings lint group.
linker_messages = "deny"

[lib]
name = "twiglane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.22"
imagesize = "0.15"
zip = { version = "9.3", default-features = false }
tar = "0.4"
flate2 = "1"
dunce = "1.0.5"
notify = "8.2.1"
portable-pty = "0.9"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-opener = "2.7.0"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
# 终止终端时向 shell 所在的独立进程组发信号，覆盖其全部后代。
libc = "0.2"
# job control 会把前台命令放进新进程组；按父子关系枚举后代，确保整棵树都能终止。
sysinfo = "0.31"

[target.'cfg(windows)'.dependencies]
# 把终端 shell 放进启用 kill-on-close 的 Job Object，整树终止。
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
benchmarks = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false

[[example]]
name = "benchmark-git"
path = "../scripts/benchmarks/main.rs"
required-features = ["benchmarks"]

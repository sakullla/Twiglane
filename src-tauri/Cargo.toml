[package]
name = "twiglane"
version = "0.2.16"
description = "Twiglane desktop Git workspace"
edition = "2021"
publish = false
license = "UNLICENSED"

[lints.rust]
# rustc excludes linker_messages from the warnings lint group.
linker_messages = "deny"

[lib]
name = "twiglane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.22"
imagesize = "0.15"
zip = { version = "9.3", default-features = false }
tar = "0.4"
flate2 = "1"
dunce = "1.0.5"
notify = "8.2.1"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10.9"
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
performance-tests = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false

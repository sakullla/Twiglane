[package]
name = "twiglane"
version = "0.1.0"
description = "Twiglane desktop Git workspace"
edition = "2021"
publish = false
license = "UNLICENSED"

[lib]
name = "twiglane"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
dunce = "1.0.5"
notify = "8.2.1"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10.9"
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false
